<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/style.css" />
    <title>Shortlinks</title>
  </head>
  <body>
    <header>
      <div id="title_header">ShortLinks</div>
      <ul class="navBar">
        <li><a class="href-homepage">Inicio</a></li>
        <li><a class="href-dashboard">DashBoard</a></li>
        <li><a class="href-login">Entrar/Cadastrar</a></li>
      </ul>
    </header>
    <section id="homepage" class="show">
      <div class="shorten-container">
        <div class="homepage-title">
          Encurte Seus Links, <br />
          Rastreie Seus Cliques.
        </div>
        <div class="input-div">
          <input
            type="url"
            id="original_url_input"
            placeholder="Cole seu URL longo aqui..."
          />
          <button class="shorten-btn">Encurtar</button>
        </div>
      </div>
      <div class="result-container">
        <div class="shorten-result-title">Seu Link Encurtado:</div>
        <div class="shorten-result-box">
          <div id="shorten_result"></div>
          <button class="copy-btn">
            <span>Copiar Link</span>
            <span class="copy-sucess">Copiado ✓</span>
          </button>
        </div>
      </div>
    </section>
    <section id="dashboard">
      <div class="dashboard-title">Painel de Gerenciamento de Links</div>
      <div class="panel-head">
        <div class="panel-cards">
          <div class="PC-title">Links Ativos</div>
          <span id="span_links"></span>
        </div>
        <div class="panel-cards">
          <div class="PC-title">Total de Acessos</div>
          <span id="span_clicks"></span>
        </div>
      </div>
      <div class="div-table">
        <div class="header-table">
          <div class="select-div">
            <label for="filterTable"><i class="fa-solid fa-list"></i></label>
            <select name="filterTable" id="filter_Table">
              <option value="clicks">Acessos</option>
              <option value="codes">Alfabética</option>
              <option value="recent">Mais Recentes</option>
              <option value="old">Mais Antigos</option>
            </select>
          </div>
          <button class="refresh-table">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <div class="input-search-table">
            <i class="fa-brands fa-sistrix"></i>
            <input
              type="text"
              id="input_search_links"
              oninput="filterTable()"
              placeholder="Procurar Links..."
            />
          </div>
          <button class="btn-create-new-link">Criar Novo Link</button>
        </div>
        <table id="dashboard_table">
          <thead>
            <tr>
              <th>Código</th>
              <th>URL original</th>
              <th>Acessos</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <script src="./js/app.js" defer></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/validation.js"></script>
  </body>
</html>
