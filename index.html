<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/style.css" />
    <title>Shortlinks</title>
  </head>
  <body>
    <header>
      <div id="title_header">ShortLinks</div>
      <ul class="navBar">
        <li><a href="homepage">Inicio</a></li>
        <li><a href="features">Recursos</a></li>
        <li><a href="login">Entrar/Cadastrar</a></li>
      </ul>
    </header>
    <section id="homepage">
      <div class="shorten-container">
        <div class="homepage-title">
          Encurte Seus Links, <br />
          Rastreie Seus Cliques.
        </div>
        <div class="input-div">
          <input
            type="url"
            id="original_url_input"
            placeholder="Cole seu URL longo aqui..."
          />
          <button class="shorten-btn">Encurtar</button>
        </div>
      </div>
      <div class="result-container">
        <div class="shorten-result-title">Seu Link Encurtado:</div>
        <div class="shorten-result-box">
          <div id="shorten_result"></div>
          <button class="copy-btn">
            <span>Copiar Link</span>
            <span class="copy-sucess">Copiado ✓</span>
          </button>
        </div>
      </div>
      <div class="dashboard">
        <div class="dashboard-title">Painel de Gerenciamento de Links</div>
        <table>
          <tr>
            <th>URL original</th>
            <th>Códigos</th>
            <th>Acessos</th>
            <th>Ações</th>
          </tr>
          <tr>
            <td>https://br.pinterest.com/pin/1010213760185638436/</td>
            <td>teste1</td>
            <td>17</td>
            <td>
              <button>
                <span>Copiar Link</span>
              </button>
            </td>
          </tr>
        </table>
      </div>
    </section>
    <script src="./js/app.js" defer></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/validation.js"></script>
  </body>
</html>
