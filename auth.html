<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js" defer></script>
    <script src="./js/header.js" defer></script>
    <title>Autenticação Shortlinks</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header id="header"></header>
    <section class="auth-container active">
      <div class="container">
        <div class="heading">Entre na sua conta</div>
        <form class="form" id="login_form">
          <div class="input-field">
            <input
              required=""
              autocomplete="on"
              type="email"
              name="email"
              id="login_email"
            />
            <label for="email">Email</label>
          </div>
          <div class="input-field">
            <input
              required=""
              minlength="6"
              autocomplete="off"
              type="password"
              name="password"
              id="login_password"
            />
            <label for="password">Senha</label>
          </div>
          <p class="form-message" id="login_message"></p>
          <div class="btn-container">
            <button class="btn">Entrar</button>
            <div class="acc-text">
              Novo por aqui ?
              <span
                class="signUp-acc-link"
                style="color: #0000ff; cursor: pointer"
                >Crie sua conta</span
              >
            </div>
          </div>
        </form>
      </div>
    </section>
    <section class="auth-container">
      <div class="container">
        <div class="heading">Crie sua conta</div>
        <form class="form" id="signUp_form">
          <div class="input-field">
            <input
              required=""
              autocomplete="off"
              type="text"
              name="name"
              id="signUp_name"
            />
            <label for="name">Nome</label>
          </div>
          <div class="input-field">
            <input
              required=""
              autocomplete="on"
              type="email"
              name="email"
              id="signUp_email"
            />
            <label for="email">Email</label>
          </div>
          <div class="input-field">
            <input
              required
              minlength="6"
              autocomplete="off"
              type="password"
              name="password"
              id="signUp_password"
              oninput="passwordValidate()"
            />
            <label for="password">Senha</label>
          </div>
          <div class="input-field">
            <input
              required
              autocomplete="off"
              type="password"
              name="confirm_password"
              id="signUp_confirm_password"
              oninput="passwordValidate()"
            />
            <label for="confirm_password">Confirme sua senha</label>
          </div>
          <p class="form-message" id="signUp_message"></p>
          <div class="btn-container">
            <button class="btn" id="signUp_btn">Criar</button>
            <div class="acc-text">
              Já tem conta ?
              <span
                class="login-acc-link"
                style="color: #0000ff; cursor: pointer"
                >Entre na sua conta</span
              >
            </div>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
